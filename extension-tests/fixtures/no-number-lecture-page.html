<!doctype html>
<!--
  Stage 0 negative fixture: lecture-page shape with the observed no-numeric-prefix recording title (2026-09-20).

  Faithful to the observed rendered Leccap player page (EECS 484 - Fall 2026,
  lecture 01, open/transcript-visible state). Sanitized: no cookies, no
  authenticated user identifiers, no recording/site route IDs, no media or
  WebVTT URLs, and the instructor name is replaced. Row markup is kept compact
  (single line per row) exactly like the real rendered page so text nodes carry
  no fixture indentation; row 1 keeps an internal line break because real
  caption cues can contain one.

  The parser reads location.href at runtime; tests stub it to
  https://leccap.engin.umich.edu/leccap/player/r/sanitized01 (structural path
  shape preserved, ID sanitized). The lecture date comes from the overview
  page: see lecture-page.selectors.json "overviewPage" and the sanitized
  overview fixture. The layout-loading class is retained deliberately: the
  observed page keeps it after completion, and the parser must not treat its
  absence as the completion signal.
-->
